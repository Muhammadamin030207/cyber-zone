services:
  # PostgreSQL ma'lumotlar bazasi
  - type: pgsql
    name: cyberarena-db
    plan: free
    database: cyberarena
    user: cyberarena
    ipAllowList: []

  # Redis
  - type: redis
    name: cyberarena-redis
    plan: free

  # Backend API (frontend Vercel'da)
  - type: web
    name: cyberarena-api
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyberarena-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: cyberarena-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Vercel'dagi frontend domenlari (vergul bilan bir nechta bo'lishi mumkin):
      - key: FRONTEND_URLS
        value: https://cyber-zone-delta.vercel.app, https://cyber-zone-fullstacks-projects-ffc4c9c9.vercel.app, http://localhost:3006
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      # Gemini AI — Render dashboard'da qo'lda o'rnating
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000