services:
  # PostgreSQL ma'lumotlar bazasi
  - type: pgsql
    name: cyberarena-db
    plan: free
    database: cyberarena
    user: cyberarena
    ipAllowList: []

  # Redis (kerak bo'lsa)
  - type: redis
    name: cyberarena-redis
    plan: free

  # Backend API
  - type: web
    name: cyberarena-api
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyberarena-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: cyberarena-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://cyberarena-hub.onrender.com

  # Frontend
  - type: web
    name: cyberarena-frontend
    plan: free
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://cyberarena-api.onrender.com
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://cyberarena-api.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000