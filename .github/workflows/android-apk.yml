name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Ensure Android SDK components + licenses
        run: |
          COMMONTOOLS="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$COMMONTOOLS" --licenses >/dev/null 2>&1 || true
          "$COMMONTOOLS" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: frontend
        run: |
          chmod +x android/gradlew
          cd android
          OUT="$(./gradlew assembleDebug --no-daemon 2>&1)"
          CODE=$?
          if [ $CODE -ne 0 ]; then
            MSG="$(printf '%s\n' "$OUT" | tail -40 | sed 's/%/%25/g; s/\r//g; s/::/;;/g' | paste -sd%0A -)"
            echo "::error::$MSG"
            exit $CODE
          fi
          echo "$OUT" | tail -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-zone-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error